name: Demo
options:
  bundleIdPrefix: com.alexeyhatkevich
  deploymentTarget:
    iOS: "17.0"
packages:
  KeyPathObservation:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Demo:
    type: application
    platform: iOS
    sources: [Demo]
    dependencies:
      - package: KeyPathObservation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexeyhatkevich.swift-observe-key-paths-not-containers.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: KeyPath Demo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
schemes:
  Demo:
    build:
      targets:
        Demo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: KeyPathObservation/KeyPathObservationTests
